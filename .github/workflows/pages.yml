name: Deploy TEAM 狭気
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: team-otokogi-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble production app
        run: |
          mkdir -p dist/static dist/pages
          cp index.html dist/index.html
          cp 404.html dist/404.html
          cp sw.js dist/sw.js
          cp static/* dist/static/
          cp pages/shared-api.js pages/brand-concept.js pages/pwa.js pages/manifest.webmanifest pages/wafu-layout.css dist/pages/
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
