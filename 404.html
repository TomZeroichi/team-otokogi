<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TEAM狭気 | 公式戦績帳</title>
</head>
<body style="margin:0;background:#071014;color:#f5dfad;font-family:system-ui,sans-serif;text-align:center;padding:18vh 24px">
<main>
<h1 style="font-size:22px">TEAM 狭気</h1>
<p>ページを確認しています…</p>
<p><a href="/team-otokogi/" style="color:#f0c66b">公式戦績帳を開く</a></p>
</main>
<script>
(() => {
  const base='/team-otokogi/';
  if(!location.pathname.startsWith(base)) return;
  const encoded=location.pathname.slice(base.length);
  let suffix='';
  try{suffix=decodeURIComponent(encoded);}catch{return;}
  // LINEやメッセージアプリがURL末尾に付ける不可視文字だけを取り除く。
  if(suffix && /^[\u200B-\u200D\u2060\uFEFF]+$/.test(suffix)){
    location.replace(base+location.search+location.hash);
  }
})();
</script>
</body>
</html>
